{% extends "base.html" %}

{% block content %}
{% load crispy_forms_tags %}


<div class="row">

    <!-- Left Sidebar -->
    <!-- load the sidebar here -->
    {% include 'dashboard/sidebar.html' %}

    <!-- Right Sidebar -->
    <div class="col-md-9">
        <h2>Add New Category</h2>

        <form action="{% url 'add_category' %}">
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class="btn btn-warning">Submit</button>
        </form>
        
    </div>
</div>

{% endblock content %}
